<!DOCTYPE html>
<html>
<head>
  <base href="/coaching-board/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iPhoneの画面固定・拡大縮小防止用の viewport 設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutters_app_coaching_board">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutters_app_coaching_board</title>
  <link rel="manifest" href="manifest.json">

  <!-- iOSのオーバースクロール・揺れを抑えるCSS -->
  <style>
    html, body {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none; /* 全方向のデフォルトジェスチャーを無効化 */
      -webkit-user-select: none;
      user-select: none;
      -webkit-overscroll-behavior: none;
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <!-- ブラウザデフォルトの上から下への引っ張り（バウンス）をJSで強制停止 -->
  <script>
    document.addEventListener('touchmove', function(e) {
      // Flutter側の操作（ドラッグなど）以外のブラウザスクロールをブロック
      e.preventDefault();
    }, { passive: false });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
